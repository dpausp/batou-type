[project]
name = "TEST_PROJECT_NAME"
version = "0.1.0"

# managed by batou-type setup
[tool.ty.environment]
extra-paths = ["stubs"]

[tool.ty.src]
include = ["components"]

# managed by batou-type setup
[tool.mypy]
mypy_path = "stubs"
explicit_package_bases = true
check_untyped_defs = true
modules = ["components"]

# managed by batou-type setup
[tool.pyright]
include = ["components"]
stubPath = "stubs"