[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27"]

[project]
name = "batou-type"
version = "2.8.0.dev0"
description = "Type-check batou deployments"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.10"
dependencies = [
    "batou-stubs",
    "mypy",
    "pytest",
    "rich",
    "ty",
    "typer",
]

[project.scripts]
batou-type = "batou_type.cli:app"

[project.entry-points.pytest11]
batou_type = "batou_type.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/batou_type"]

[tool.hatch.build.targets.sdist]
include = ["src/batou_type"]

[project.optional-dependencies]
ext = ["batou_ext-stubs"]

[tool.ruff]
extend-exclude = ["testproject"]

[dependency-groups]
dev = [
    "batou>=2.7.0",
    "batou-ext-stubs",
    "batou-stubs",
    "pytest-cov>=7.1.0",
]
