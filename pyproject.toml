[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27"]

[project]
name = "batou-type"
version = "2.8.0.dev0"
description = "Type-check batou deployments"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.13"
dependencies = [
    "libcst",
    "pydantic",
    "rich",
    "typer",
    "stogger",
    "ty>=0.0.34",
    "tomli-w",
]

[project.optional-dependencies]
mypy = ["mypy"]
pytest = ["pytest"]

[project.scripts]
batou-type = "batou_type.cli:app"

[project.entry-points.pytest11]
batou_type = "batou_type.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/batou_type"]

[tool.hatch.build.targets.sdist]
include = ["src/batou_type"]

[tool.ruff]
extend-exclude = ["examples", "testproject", "src/batou_type/vendor"]

[dependency-groups]
test = [
    "batou>=2.7.0",
    "batou-type[pytest,mypy]",
    "pytest-cov>=7.1.0",
    "pytest-archon>=0.0.7",
    "pytest-ruff>=0.5",
    "pytest-ty>=0.2.1",
    "pytest-stogger",
    "pytest-structlog>=1.2",
]
lint = [
    "pyupgrade",
    "ruff",
]
docs = [
    "sphinx>=8.0.0",
    "sphinx-autoapi>=3.0.0",
    "myst-parser>=4.0.0",
    "furo>=2024.0.0",
    "sphinx-autodoc-typehints>=3.0.0",
    "sphinx-copybutton>=0.5.0",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "docs"},
]

[tool.tox]
env_list = ["fix", "ty", "3.13", "3.14", "docs"]
requires = ["tox>=4.20"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
package = "wheel"
dependency_groups = ["test"]
commands = [["pytest"]]

[tool.tox.env.cov]
description = "Run tests with coverage"
base_python = ["3.14"]
dependency_groups = ["test"]
commands = [["pytest", "--cov=batou_type", "--cov-report=term-missing"]]

[tool.tox.env.fix]
description = "Lint and format with autofix"
skip_install = true
depends = []
dependency_groups = ["lint"]
commands = [
    ["ruff", "check", "--fix", "--unsafe-fixes", "."],
    ["ruff", "format", "."],
]
allowlist_externals = ["python"]

[tool.tox.env.ty]
description = "Type check with ty"
dependency_groups = ["test"]
commands = [["ty", "check", "src/", "tests/"]]

[tool.tox.env.docs]
description = "Build Sphinx documentation"
dependency_groups = ["docs"]
commands = [["sphinx-build", "-b", "html", "docs", "docs/_build"]]

[tool.ty.src]
exclude = ["src/batou_type/vendor/"]

[tool.pytest-stogger]
source = "src/batou_type"
exempt_event_ids = []
suppression_budget = 0

[tool.pytest-stogger.per-file-ignores]
"fixer.py" = ["complexity-needs-log", "except-must-log"]
"core.py" = ["complexity-needs-log"]
"output.py" = ["complexity-needs-log"]
"pytest_plugin.py" = ["complexity-needs-log"]

[tool.uv.sources]
stogger = { git = "https://github.com/dpausp/stogger", rev = "2026.5.6" }
pytest-stogger = { git = "https://github.com/dpausp/pytest-stogger", rev = "2026.5.6" }
