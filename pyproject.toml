[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27"]

[project]
name = "batou-typecheck"
version = "2.8.0.dev0"
description = "Type-check batou deployments"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.10"
dependencies = [
    "batou-stubs",
    "ty",
]

[project.scripts]
batou-typecheck = "batou_typecheck:main"

[tool.hatch.build.targets.wheel]
packages = ["src/batou_typecheck"]

[tool.hatch.build.targets.sdist]
include = ["src/batou_typecheck"]
